# ---------------------------------------------------------------------------
# Reverse proxy untuk FISCA: http://<host> -> web (Next.js :3000), dan
# /api/v1/... -> api (:8080) sehingga API same-origin dari perangkat mana pun.
# resolver Docker (127.0.0.11) + proxy_pass variabel: nama diselesaikan
# per-request, jadi IP container yang pindah setelah restart tidak lagi
# membuat upstream basi (502 Connection refused).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;

    location / {
        set $web_upstream http://web:3000;
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket headers: Next.js dev/prefetch occasionally upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # API same-origin: /api/v1/... diteruskan utuh (tanpa URI di proxy_pass,
    # nginx mempertahankan path asli) ke container api.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
