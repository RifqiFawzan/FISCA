# ---------------------------------------------------------------------------
# Reverse proxy untuk FISCA: http://localhost -> web (Next.js :3000).
# Aplikasi browser tetap memanggil API di host :8080 langsung (NEXT_PUBLIC_
# API_BASE_URL sudah ter-bake saat build), jadi tidak ada proxy /api di sini —
# cukup tambahkan origin nginx ke CORS_ORIGINS di .env.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket headers: Next.js dev/prefetch occasionally upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # API same-origin: /api/v1/... diteruskan utuh (tanpa URI di proxy_pass,
    # nginx mempertahankan path asli) ke container api.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
